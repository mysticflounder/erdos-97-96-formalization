[[milestone]]
title = "Express Problem 97 as a bound on repeated distances from one vertex"
description = "Define the pinned distance multiplicity at a point as the greatest number of vertices lying on one positive-radius circle centered there. Prove both directions between the original four-equidistant-witness formulation of Problem 97 and the assertion that every nonempty finite set in strictly convex position has a vertex of pinned multiplicity at most three. This milestone establishes the repeated-distance language used by the large-cardinality argument; it does not resolve Problem 97."
theorem = "Erdos9796Mission.problem97_iff_exists_pinnedMultiplicity_le_three"
reason = "Add the proved pinned-multiplicity interface and record both implications connecting it to the mission statement."
