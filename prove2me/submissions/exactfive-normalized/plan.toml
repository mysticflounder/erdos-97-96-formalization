[[theorem]]
name = "Erdos9796Mission.normalized_mutual_return_false"
title = "A separated two-circle return configuration is impossible"
file = "submissions/exactfive-normalized/platform/Theorems/Thm_Erdos9796Mission_normalized_mutual_return_false.lean"
natural_language_statement = "Let five points of a finite planar set in strictly convex position have the listed noncoincidence relations. Suppose an injective affine chart sends two endpoints to (-1,0) and (1,0), points O and c to (0,-σh) and (0,σk), and the return point to (x,σy), where σ is 1 or -1, s is positive with s² = 3 and s ≤ h, and 0 < k ≤ 1. If the two listed equal-distance equations hold and an affine functional is positive on the left endpoint and c but negative on O and the return point, then these assumptions are contradictory."
source = "https://github.com/mysticflounder/erdos-97-96-formalization/blob/743b102037e9c43dd610a4db761433ce35862a99/lean/Erdos9796Proof/P97/ATail/ExactFiveMutualReturnChord.lean#L335-L361"
tags = ["discrete-geometry", "erdos-97", "affine-geometry", "strict-convexity"]

