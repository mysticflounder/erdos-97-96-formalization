[[milestone]]
title = "A removable vertex produces a smaller counterexample"
description = "Define a removable vertex as one whose deletion preserves four equidistant witnesses at every remaining vertex. Prove that deleting such a vertex from a point set in strictly convex position with at least two points yields a nonempty, strictly smaller set in strictly convex position that still has the four-witness property. This establishes the descent step after a removable vertex has been found; existence remains the separate large-cardinality problem."
theorem = "Erdos9796Mission.smaller_counterexample_of_removable"
sort_order = 2
reason = "Expose the proved deletion step between the completed small-cardinality base range and the open theorem that must find a removable vertex in every large minimal counterexample."
