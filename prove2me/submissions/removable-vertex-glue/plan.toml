private = false

[[theorem]]
name = "Erdos9796Mission.smaller_counterexample_of_removable"
title = "Deleting a removable vertex gives a smaller counterexample"
file = "submissions/removable-vertex-glue/platform/Theorems/Thm_Erdos9796Mission_smaller_counterexample_of_removable.lean"
natural_language_statement = "Let A be a finite planar point set in strictly convex position with at least two points. If A has a vertex whose deletion preserves four equidistant witnesses at every remaining vertex, then there exists a nonempty point set with fewer points than A that remains in strictly convex position and retains the four-witness property."
source = "https://github.com/mysticflounder/erdos-97-96-formalization/blob/743b102037e9c43dd610a4db761433ce35862a99/lean/Erdos9796Proof/P97/SmallerCounterexample.lean#L30-L39"
tags = ["discrete-geometry", "erdos-97", "descent"]

