[[definition]]
name = "Erdos9796Mission_RemovableVertex"
file = "submissions/removable-vertex-glue/platform/Definitions/Def_Erdos9796Mission_RemovableVertex.lean"
title = "Removable vertex for the repeated-distance property"
natural_language_statement = "A vertex of a finite planar point set is removable when deleting it preserves the property that every remaining vertex has four other points at some common positive distance; the radius may depend on the remaining vertex."
source = "https://github.com/mysticflounder/erdos-97-96-formalization/blob/743b102037e9c43dd610a4db761433ce35862a99/lean/Erdos9796Proof/P97/SmallerCounterexample.lean#L25-L26"
