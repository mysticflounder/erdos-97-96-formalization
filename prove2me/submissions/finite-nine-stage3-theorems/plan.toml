[[milestone]]
title = "Transfer the existing nine-point endpoint configuration proof"
description = "Transfer the authenticated Lean construction of the boundary triangle, its three cap regions, and its distinguished vertices for any nine-point counterexample. This is an existing source proof, not a request to reconstruct the geometry. It is the first supporting result in the nine-point argument."
theorem = "Erdos9796FiniteNine.shell"
sort_order = 1
reason = "Publish the already-proved shell interface first so later transfer solutions can import it without duplicating completed work."

[[milestone]]
title = "Exclude the interior-point/opposite-vertex pattern at the first triangle vertex"
description = "For the first distinguished triangle vertex, rule out an escaping four-point distance class containing one point in the second cap interior and the second triangle vertex in the third cap. The repository already contains the source proof, and this milestone records its verified transfer."
theorem = "Erdos9796FiniteNine.form_b_v1"
sort_order = 2
reason = "Preserve the nine-cut DAG edge shell -> form_b_v1 and expose the already-completed source proof."

[[milestone]]
title = "Exclude the interior-point/opposite-vertex pattern at the second triangle vertex"
description = "At the second distinguished triangle vertex, rule out the cyclic relabelling of the interior-point/opposite-vertex witness pattern excluded at the first vertex. The proof transports the already verified first-vertex result around the boundary triangle."
theorem = "Erdos9796FiniteNine.form_b_v2"
sort_order = 3
reason = "Preserve the nine-cut DAG edge form_b_v1 -> form_b_v2 required before the Form a transfer."

[[milestone]]
title = "Exclude the two-interior-point pattern at the first triangle vertex"
description = "For the first distinguished triangle vertex, rule out an escaping four-point distance class containing one point in each of the other two cap interiors. The proof uses the verified second-vertex interior-point/opposite-vertex exclusion."
theorem = "Erdos9796FiniteNine.form_a_v1"
sort_order = 4
reason = "Preserve the load-bearing form_b_v2 -> form_a_v1 dependency and prevent contributors from restarting a closed source branch."

[[milestone]]
title = "Exclude the opposite-vertex/interior-point pattern at the first triangle vertex"
description = "For the first distinguished triangle vertex, rule out an escaping four-point distance class containing the third triangle vertex in the second cap and one point in the third cap interior. The repository already contains the source proof, and this milestone records its verified transfer."
theorem = "Erdos9796FiniteNine.form_c_v1"
sort_order = 5
reason = "Preserve the nine-cut DAG edge shell -> form_c_v1 while recording that the mathematical proof already exists."

[[milestone]]
title = "Exclude the remaining cyclic witness-location patterns"
description = "Use cyclic relabelling of the boundary triangle to exclude the five remaining versions of the two-interior-point, interior-point/opposite-vertex, and opposite-vertex/interior-point patterns at the second and third distinguished vertices."
theorem = "Erdos9796FiniteNine.cyclic_forms"
sort_order = 6
reason = "Preserve the three incoming DAG edges to cyclic_forms and consolidate the five already-proved cyclic exclusions."

[[milestone]]
title = "Prove cap containment for four-point distance classes"
description = "After all nine escaped witness-location patterns have been excluded, prove that every positive-radius distance class with at least four points centered at a distinguished triangle vertex lies entirely in the corresponding cap region."
theorem = "Erdos9796FiniteNine.cap_containment"
sort_order = 7
reason = "Preserve the five incoming DAG edges to cap_containment and expose the existing N4 endpoint conclusion."

[[milestone]]
title = "Place all three cap regions on equal-radius circles"
description = "After cap containment is established, prove that one positive radius places every point of each endpoint cap on the circle centered at its corresponding distinguished triangle vertex. The repository already contains the source proof, and this milestone records its verified transfer."
theorem = "Erdos9796FiniteNine.circle_placement"
sort_order = 8
reason = "Preserve the nine-cut DAG edge cap_containment -> circle_placement and make the completed circle-placement proof reusable."

[[milestone]]
title = "Exclude a four-witness point from every cap interior"
description = "Assuming cap containment and the four-equidistant-points property, prove that no point of the nine-point configuration lies in the interior of any endpoint cap. This exhausts the final geometric case and completes the exact nine-point exclusion."
theorem = "Erdos9796FiniteNine.single_apex_exhaustion"
sort_order = 9
reason = "Preserve the final child edge circle_placement -> single_apex_exhaustion before assembling the tiny mission-root solution."

