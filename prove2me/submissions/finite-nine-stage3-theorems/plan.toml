title = "Nine-point endpoint configuration"
file = "submissions/finite-nine-stage3-theorems/platform/Theorems/Thm_Erdos9796FiniteNine_shell.lean"
natural_language_statement = "Every nine-point convex counterexample with four equidistant witnesses at each vertex determines a boundary triangle and three associated cap regions used in the subsequent case analysis."
source = "https://github.com/mysticflounder/erdos-97-96-formalization/tree/6e3e2a849c67f518d75fd45a09a201a6c8f4cd8f/lean/Erdos9796Proof/P97/N9Endpoint"
