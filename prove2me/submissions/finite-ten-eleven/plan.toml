[[theorem]]
name = "Erdos9796Mission.finite_ten_exclusion"
title = "Exact-ten endpoint: exclude a ten-vertex counterexample"
file = "submissions/finite-ten-eleven/Theorems/Thm_Erdos9796Mission_finite_ten_exclusion.lean"
natural_language_statement = "No convex-independent set of exactly ten points in the Euclidean plane has four equidistant points at every vertex."
source = "https://github.com/mysticflounder/erdos-97-96-formalization/blob/ff13d98d92694d0e460549031049f08357ff6150/lean/Erdos9796Proof/P97/FiniteN10.lean#L179-L193"
tags = ["convex-position", "discrete-geometry", "erdos-97", "exact-cardinality"]

[[theorem]]
name = "Erdos9796Mission.finite_eleven_exclusion"
title = "Exact-eleven endpoint: exclude an eleven-vertex counterexample"
file = "submissions/finite-ten-eleven/Theorems/Thm_Erdos9796Mission_finite_eleven_exclusion.lean"
natural_language_statement = "No convex-independent set of exactly eleven points in the Euclidean plane has four equidistant points at every vertex."
