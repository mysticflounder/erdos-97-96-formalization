[project]
name = "erdos-97-96-formalization"
slug = "erdos-97-96-formalization"

[paths]
db          = "data/proof-blueprint.db"
lean_lib    = "lean"

[obligations]
root_slug = "root"

[publish]
# P97 is the only configured publish target. P96 is a separately checked
# theorem root that currently inherits the same open proof frontier; it is not
# included in Proof Blueprint publication commands unless this list changes.
# Counts are deliberately not hard-coded here: query the live spine and refresh
# references before reporting or publishing.
target_symbol = ["Problem97.erdos97_rhs"]
state = "wip"  # "wip" | "complete" — config compat; affects no verdict (sorry is always open work)

[axioms]
# Project-declared approved custom axioms (full FQ names). Native-reduction
# trust is declared separately below and must match the observed closure.
approved = []

[trust]
# native_decide certificate closure under the project's bv_decide-standard
# policy (2026-06-05); compiler trust approved by Adam 2026-07-06.
native_axioms = ["Lean.ofReduceBool", "Lean.trustCompiler"]

[mining]
# Generated certificate subtrees (Erdos9796Proof.P97.{Endpoint,Surplus}Certificate.*)
# — ~97% of the corpus, no proof structure to anchor on. Excluded from the
# proof-blueprint kernel mine and rendered as 🔒 trusted leaves on the spine
# (declared mining boundary). This does not affect Lean imports or `lake-build`:
# imported certificate modules are still compiled. Still indexed, so a cert
# sorry is caught by the source scan and by `#print axioms` on the target; the
# target axiom closure is unaffected.
skip = [
  # Standalone DIMACS exporters deliberately declare the executable entrypoint
  # `main`.  They are artifact generators, never proof-spine imports, and two
  # such modules cannot be imported into one mining batch because their root
  # entrypoints collide.  Their imported proof modules remain mined normally.
  "*.ATail.*Export",
  "*.EndpointCertificate.*",
  "*.SurplusCertificate.*",
  "*.EndpointCertificate.RowZeros.Direct.*",
  "*.EndpointCertificate.RowZeros.Product.*",
  "*.EndpointCertificate.RowZeros.Bank",
  "*.SurplusCertificate.RowZeros.ExactMaskBits.*",
  "*.SurplusCertificate.RowZeros.ShapeFacts.*",
  "*.SurplusCertificate.RowZeros.Direct.*",
  "*.SurplusCertificate.RowZeros.Product.*",
  "*.SurplusCertificate.RowZeros.Bank",
]

[index]
# The Census-554 BV placement bank (`prefixCore_of_pNdM`) discharges one
# 46-antecedent / 42-core bitblast per file under `bv_decide` with
# `maxHeartbeats 0`.  One file did not terminate in 8 h of CPU, so building
# all twelve is not viable on any normal cycle.  They are an unreachable leaf
# — `All.lean` gathers them, only `CapSelectedBVExperiment` imports that, and
# nothing imports it — so no spine theorem depends on them and the P97 target
# axiom closure is unaffected.  Skipping them here keeps `plan prepare` from
# building them.  NOTE: unlike `[mining].skip`, an `[index].skip` file is not
# scanned for `sorry` either; that is acceptable only because nothing on the
# spine reaches these.
skip = [
  # --- the unreachable island -------------------------------------------
  # None of the modules below is reachable from `defaultTargets`
  # (["Erdos9796", "Erdos9796Proof", "Erdos9796BankSupport"]).  A `lean_lib`
  # with no `globs` builds only its root's import closure, which is 5203 of
  # the 6540 project modules on disk; the other 1337 are never compiled by
  # `lake build` and so rotted unnoticed across the Mathlib v4.33.1 bump.
  # `plan prepare` builds every *indexable* module, so it is the first thing
  # that ever looked at them.
  #
  # Three groups, all excluded so `plan prepare` can complete:
  #   1. the Census-554 BV placement bank — one 46-antecedent/42-core
  #      bitblast per file under `bv_decide` with `maxHeartbeats 0`; one file
  #      did not terminate in 8 h of CPU.
  #   2. `ExactTwelveRigid221FiveOmissionSat` — kernel interpreter OOM at the
  #      `-M16384` cap, Lean exits 134.
  #   3. six modules needing real proof repair after the Mathlib bump, plus
  #      the reverse-dependency closure that imports them (skipping a module
  #      does not stop an indexed importer from dragging it back in).
  #
  # The P97 publish target and its axiom closure are unaffected.  NOTE: unlike
  # `[mining].skip`, an `[index].skip` file is not scanned for `sorry`.
  # Remove an entry once its proof is repaired and it builds.
  "Erdos9796Proof/P97/Census554/CapSelectedBVPlacements/*.lean",
  "Erdos9796Proof/P97/ATail/FrontierLiveClosure/ExactTwelveRigid221FiveOmissionFormulaSat.lean",
  "Erdos9796Proof/P97/ATail/FrontierLiveClosure/ExactTwelveRigid221FiveOmissionSat.lean",
  "Erdos9796Proof/P97/ATail/FrontierLiveClosure/ExactTwelveRigid221FiveOmissionTerminalBankConsumer.lean",
  "Erdos9796Proof/P97/ATail/FrontierLiveClosure/ExactTwelveRigid221StaticConvexSourceOrderConsumer.lean",
  "Erdos9796Proof/P97/ATail/FrontierLiveClosure/FirstNonHitCommonRadiusFinitePayload.lean",
  "Erdos9796Proof/P97/ATail/FrontierLiveClosure/FirstNonHitCommonRadiusReducedFinitePayload.lean",
  "Erdos9796Proof/P97/ATail/FrontierLiveClosure/FirstNonHitCompleteFiniteSourceTheory.lean",
  "Erdos9796Proof/P97/ATail/FrontierLiveClosure/FirstNonHitCompleteFiniteSourceTheoryBranches.lean",
  "Erdos9796Proof/P97/ATail/FrontierLiveClosure/FirstNonHitCompleteFiniteSourceTheoryContext.lean",
  "Erdos9796Proof/P97/ATail/FrontierLiveClosure/FirstNonHitCompleteFiniteSourceTheoryCore.lean",
  "Erdos9796Proof/P97/ATail/FrontierLiveClosure/FirstNonHitFiniteBlockerFiber.lean",
  "Erdos9796Proof/P97/ATail/FrontierLiveClosure/FirstNonHitFiniteHingressPayload.lean",
  "Erdos9796Proof/P97/ATail/FrontierLiveClosure/FirstNonHitFiniteOverlapTerminal.lean",
  "Erdos9796Proof/P97/ATail/FrontierLiveClosure/FirstNonHitIngressFiniteLanding.lean",
  "Erdos9796Proof/P97/ATail/FrontierLiveClosure/FirstNonHitRetainedDeletionFinitePayload.lean",
  "Erdos9796Proof/P97/ATail/FrontierLiveClosure/FirstNonHitSourceTotalFiniteAssignment.lean",
  "Erdos9796Proof/P97/ATail/FrontierLiveClosure/GoodMutualOmissionDeletionOutcome.lean",
  "Erdos9796Proof/P97/ATail/FrontierLiveClosure/Rigid221SourceRowCapBetweenness.lean",
  "Erdos9796Proof/P97/ATail/GoodMutualOmissionTwoDeletionNetwork.lean",
  "Erdos9796Proof/P97/ATail/SevenSourceCriticalShellDichotomy.lean",
  "Erdos9796Proof/P97/ATail/SevenSourceCriticalShellMutualOmission.lean",
  "Erdos9796Proof/P97/ATail/SevenSourcePaleyRelabel.lean",
  "Erdos9796Proof/P97/ATail/SevenSourceTournament.lean",
  "Erdos9796Proof/P97/FiniteN10.lean",
  "Erdos9796Proof/P97/FiniteN11.lean",
  "Erdos9796Proof/P97/MultiCenter/Certificate/ClassPermutationBridge.lean",
  "Erdos9796Proof/P97/MultiCenter/Certificate/ClassPermutationTable.lean",
  "Erdos9796Proof/P97/MultiCenter/Certificate/LocalEnumerator.lean",
  "Erdos9796Proof/P97/MultiCenter/Certificate/LocalEnumeratorCertificate.lean",
  "Erdos9796Proof/P97/MultiCenter/Certificate/ProfileClassCompletion.lean",
  "Erdos9796Proof/P97/MultiCenter/Certificate/ProfileClassCoverageCertificate.lean",
  "Erdos9796Proof/P97/MultiCenter/Certificate/ProfileSymmetry.lean",
