name = "Erdos9796"
version = "0.1.0"
keywords = ["math", "combinatorics", "erdos", "discrete-geometry"]
defaultTargets = ["Erdos9796", "Erdos9796Proof", "Erdos9796BankSupport"]
# -M: per-module memory cap (MB) for the elaborator. Some of the discrete-
#     geometry case-split files are heavy; this keeps a single module from
#     running away. NOTE: moreLeanArgs is part of every module's build trace,
#     so changing it invalidates all package oleans — don't touch casually.
# -s: thread stack (bytes). The deeper case-split proofs need more than the
#     default; 2 GB is the proven value on macOS (4 GB is silently rejected).
moreLeanArgs = ["-M16384", "-s2097152"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# The generated certificate banks are machine-emitted with long literal
# polynomial lists; the 100-column rule produces thousands of warnings there and
# nothing actionable anywhere. Off package-wide so no source file needs its own
# `set_option linter.style.longLine false`.
weak.linter.style.longLine = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[require]]
name = "formal_conjectures"
git = "https://github.com/google-deepmind/formal-conjectures.git"
rev = "8323e878b83fcd7f4a448256069352a265460d75"

[[lean_lib]]
name = "Erdos9796"

[[lean_lib]]
name = "Erdos9796Proof"

# The `census/card_head` banks pin a frozen `LEAN_DEPENDENCY_MODULES` tuple that
# includes modules no spine theorem imports. Without this root `lake build` never
# compiles them and never reports a regression in them, yet re-mining a bank needs
# their oleans. See `lean/Erdos9796BankSupport.lean`.
[[lean_lib]]
name = "Erdos9796BankSupport"

# Comparator auditability gate (leanprover/comparator). `Challenge` imports
# mathlib ONLY and states the headline results as `sorry` stubs; `Solution`
# imports the project and discharges them under identical `Headline.*` names.
# Built by `comparator/check-conformance.sh`; see `comparator/README.md`.
#   lake build Challenge Solution
[[lean_lib]]
name = "Challenge"
srcDir = "../comparator"

[[lean_lib]]
name = "Solution"
srcDir = "../comparator"

# Comparator axiom reports as a real Lake target. Lake replays the saved build
# log for cached targets, preserving the `#print axioms` output for the wrapper.
[[lean_lib]]
name = "ComparatorAxiomAudit"
srcDir = "../comparator"
roots = ["«axiom-audit»"]

# M1 ERASE eval gate as a compiled executable: the search primitives run as
# native code instead of through the `#eval` interpreter. Diagnostic only —
# proves nothing, no proof artifact imports it.
[[lean_exe]]
name = "erase_m1_gate"
root = "Erdos9796Proof.P97.ErasedCertificate.ErasedNativeEvalGate"
